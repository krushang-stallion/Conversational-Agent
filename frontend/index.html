<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neural Sphere Visualization - Conversational AI Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold-primary: #d8bd5c;
      --gold-bright: #fff3a1;
      --gold-glow: rgba(216, 189, 92, 0.45);
      --cyan-bright: #38ef7d;
      --cyan-pulse: #11998e;
      --bg-dark: #070806;
      --glass-bg: rgba(14, 16, 12, 0.65);
      --glass-border: rgba(216, 189, 92, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-dark);
      color: #e2e8f0;
      overflow: hidden;
      font-family: "IBM Plex Mono", Consolas, monospace;
      user-select: none;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 15;
      pointer-events: none;
      opacity: 0.15;
      background-image: linear-gradient(rgba(255, 245, 189, 0.025) 1px, transparent 1px);
      background-size: 100% 4px;
      mix-blend-mode: screen;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      cursor: pointer;
    }

    #label-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }

    /* Floating 3D Node Labels */
    .network-label {
      width: max-content;
      color: var(--gold-primary);
      letter-spacing: 0.05em;
      opacity: 0.94;
      text-shadow: 0 0 8px rgba(255, 213, 81, 0.4);
      transform: translateY(-50%);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    .network-label strong {
      display: block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
    .network-label span {
      display: block;
      margin-top: 3px;
      color: rgba(216, 189, 92, 0.6);
      font-size: 7px;
      letter-spacing: 0.1em;
    }
    .network-label.node-highlight {
      color: #ffffff !important;
      text-shadow: 0 0 16px rgba(0, 255, 200, 0.9), 0 0 30px rgba(0, 255, 200, 0.6) !important;
      transform: translateY(-50%) scale(1.28);
      background: rgba(4, 28, 22, 0.78) !important;
      border: 1px solid rgba(0, 255, 200, 0.75) !important;
      padding: 6px 12px !important;
      border-radius: 6px !important;
      backdrop-filter: blur(10px) !important;
      box-shadow: 0 0 24px rgba(0, 255, 200, 0.45), inset 0 0 12px rgba(0, 255, 200, 0.25) !important;
      z-index: 100 !important;
    }
    .network-label.node-highlight span {
      color: #00ffc8 !important;
      font-weight: 700;
    }

    /* Initial Wake-up Label */
    #start-label {
      position: absolute;
      top: 65%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      color: var(--gold-primary);
      font-size: 12px;
      letter-spacing: 6px;
      text-transform: uppercase;
      pointer-events: none;
      animation: pulse-label 2.5s infinite ease-in-out;
      transition: opacity 0.5s ease, transform 0.5s ease;
      text-shadow: 0 0 12px rgba(216, 189, 92, 0.6);
      border: 1px solid rgba(216, 189, 92, 0.3);
      padding: 12px 28px;
      border-radius: 6px;
      background: rgba(10, 8, 2, 0.5);
      backdrop-filter: blur(8px);
    }
    #start-label.hidden {
      opacity: 0 !important;
      animation: none !important;
      transform: translate(-50%, -40%);
      pointer-events: none;
    }
    @keyframes pulse-label {
      0%, 100% { opacity: 0.35; border-color: rgba(216, 189, 92, 0.15); }
      50% { opacity: 1; border-color: rgba(216, 189, 92, 0.65); box-shadow: 0 0 25px rgba(216, 189, 92, 0.25) inset; }
    }

    /* Top Navigation & Status Overlay */
    .top-bar {
      position: absolute;
      top: 24px;
      left: 28px;
      right: 28px;
      z-index: 25;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--gold-bright);
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(216, 189, 92, 0.5);
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--gold-primary);
      transition: all 0.3s ease;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #705719;
      transition: all 0.3s ease;
    }

    .status-pill.listening .status-dot {
      background: #38ef7d;
      box-shadow: 0 0 8px #38ef7d;
      animation: pulse-dot 1.5s infinite;
    }
    .status-pill.thinking .status-dot {
      background: #00f2fe;
      box-shadow: 0 0 8px #00f2fe;
      animation: pulse-dot 0.8s infinite;
    }
    .status-pill.speaking .status-dot {
      background: #ffd700;
      box-shadow: 0 0 10px #ffd700;
      animation: pulse-dot 1.2s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.6; }
    }

    .top-actions {
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }

    .icon-btn {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--gold-primary);
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      font-family: inherit;
      letter-spacing: 1px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s ease;
    }
    .icon-btn:hover {
      background: rgba(216, 189, 92, 0.15);
      border-color: var(--gold-bright);
      color: #ffffff;
      box-shadow: 0 0 15px rgba(216, 189, 92, 0.3);
    }

    /* Bottom Subtitle & Audio Overlay */
    .subtitles-container {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      width: min(720px, 90vw);
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
      transition: all 0.4s ease;
    }

    .subtitle-card {
      width: 100%;
      background: rgba(10, 12, 9, 0.78);
      border: 1px solid rgba(216, 189, 92, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 15px rgba(216, 189, 92, 0.12);
      backdrop-filter: blur(16px);
      border-radius: 12px;
      padding: 16px 22px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      opacity: 0;
      transform: translateY(15px);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .subtitle-card.active {
      opacity: 1;
      transform: translateY(0);
    }

    .subtitle-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .speaker-badge {
      font-weight: 700;
      color: var(--gold-bright);
    }
    .speaker-badge.user {
      color: #38ef7d;
    }
    .speaker-badge.agent {
      color: #ffd700;
    }

    .voice-meter-bars {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 12px;
    }
    .meter-bar {
      width: 2px;
      height: 4px;
      background: var(--gold-primary);
      border-radius: 1px;
      transition: height 0.08s ease;
    }

    .subtitle-text {
      font-size: 14px;
      line-height: 1.55;
      color: #f1f5f9;
      font-family: 'Outfit', sans-serif;
      font-weight: 400;
      word-wrap: break-word;
    }

    /* History Drawer */
    #history-drawer {
      position: absolute;
      top: 0;
      right: -380px;
      width: 360px;
      height: 100vh;
      background: rgba(8, 10, 7, 0.92);
      border-left: 1px solid rgba(216, 189, 92, 0.25);
      backdrop-filter: blur(20px);
      z-index: 40;
      display: flex;
      flex-direction: column;
      transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: -10px 0 40px rgba(0, 0, 0, 0.8);
    }
    #history-drawer.open {
      right: 0;
    }

    .drawer-header {
      padding: 24px 20px;
      border-bottom: 1px solid rgba(216, 189, 92, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .drawer-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--gold-bright);
      text-transform: uppercase;
    }
    .close-btn {
      background: transparent;
      border: none;
      color: var(--gold-primary);
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
      transition: color 0.2s;
    }
    .close-btn:hover {
      color: #ffffff;
    }

    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .history-entry {
      background: rgba(20, 24, 18, 0.6);
      border: 1px solid rgba(216, 189, 92, 0.15);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .history-role {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .history-role.user { color: #38ef7d; }
    .history-role.agent { color: #ffd700; }
    .history-content {
      font-size: 12px;
      color: #cbd5e1;
      font-family: 'Outfit', sans-serif;
      line-height: 1.45;
    }

    @media (max-width: 768px) {
      .top-bar { left: 16px; right: 16px; top: 16px; }
      .brand-title { display: none; }
      #history-drawer { width: 100vw; right: -100vw; }
      .subtitle-card { padding: 12px 16px; }
      .subtitle-text { font-size: 13px; }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="label-container"></div>
  
  <div id="start-label">CLICK TO WAKEUP NEURAL SYSTEM</div>
  
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="brand-group">
      <div class="brand-title">Neural Sphere</div>
      <div class="status-pill" id="status-pill">
        <div class="status-dot"></div>
        <span id="status-text">SYSTEM DORMANT</span>
      </div>
    </div>
    
    <div class="top-actions">
      <button class="icon-btn" id="history-toggle-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>LOGS</span>
      </button>
    </div>
  </div>

  <!-- Bottom Live Subtitle Card -->
  <div class="subtitles-container">
    <div class="subtitle-card" id="subtitle-card">
      <div class="subtitle-header">
        <span class="speaker-badge" id="speaker-badge">NEURAL CORE</span>
        <div class="voice-meter-bars" id="voice-meter">
          <div class="meter-bar"></div>
          <div class="meter-bar"></div>
          <div class="meter-bar"></div>
          <div class="meter-bar"></div>
          <div class="meter-bar"></div>
        </div>
      </div>
      <div class="subtitle-text" id="subtitle-text">Click anywhere to activate neural speech session...</div>
    </div>
  </div>

  <!-- Transcript History Drawer -->
  <div id="history-drawer">
    <div class="drawer-header">
      <div class="drawer-title">Neural Session Log</div>
      <button class="close-btn" id="history-close-btn">&times;</button>
    </div>
    <div class="drawer-body" id="drawer-body">
      <div style="font-size: 11px; color: #64748b; text-align: center; margin-top: 20px;">
        No session transcripts recorded yet.
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
